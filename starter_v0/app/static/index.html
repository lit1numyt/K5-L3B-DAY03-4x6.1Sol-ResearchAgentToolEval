<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Research Chatbot</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">R</span><span>Research Bot</span></div>
      <button class="new-chat" id="new-chat"><span>＋</span> New chat</button>
      <div class="section-label">Recent chats</div>
      <nav class="conversation-list" id="conversation-list" aria-label="Recent conversations"></nav>
      <div class="sidebar-footer">Private local history<br><span>Agent-powered research workspace</span></div>
    </aside>
    <main class="main-panel">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Open conversations">☰</button>
        <div><div class="eyebrow">RESEARCH WORKSPACE</div><h1 id="chat-title">New conversation</h1></div>
        <div class="status-pill"><span></span> Ready</div>
      </header>
      <section class="messages" id="messages" aria-live="polite"></section>
      <div class="composer-wrap">
        <div class="composer-hint">Ask about research, sources, policies, papers, or web findings.</div>
        <form class="composer" id="composer">
          <textarea id="message-input" rows="1" maxlength="12000" placeholder="Ask the research agent anything..." aria-label="Message"></textarea>
          <button class="send-button" id="send-button" type="submit" aria-label="Send message">↑</button>
        </form>
        <div class="composer-note">Enter to send · Shift + Enter for a new line</div>
      </div>
    </main>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
